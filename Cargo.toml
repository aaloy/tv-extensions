[package]
name = "tv-extensions"
version = "0.1.0"
edition = "2024"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
license = "MIT"
repository = "https://github.com/aovestdipaperino/tv-extensions"
description = "Extensions for turbo-vision: host-driven applications for embedders such as WASM guests, and a table grid with column separators"
keywords = ["tui", "turbo-vision", "wasm"]
categories = ["command-line-interface", "wasm"]
readme = "README.md"
exclude = ["website/*", ".superpowers/*"]

[lib]
name = "tv_extensions"
path = "src/lib.rs"

[dependencies]
# Turbo Vision without its terminal: `default-features = false` drops the
# `native` feature (crossterm and arboard), so this crate builds for
# wasm32-wasip1. Pinned to core's `wasm-host-driven` branch until a
# turbo-vision release carries the host-driven hooks (`Backend::is_host_driven`,
# `Application::step`, `Table::column_offsets`).
turbo-vision = { git = "https://github.com/aovestdipaperino/turbo-vision-4-rust", rev = "eae2cc843ed9744f8d5ece9571d3c2bcbedf602d", default-features = false }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

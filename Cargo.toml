[package]
name = "tv-extensions"
version = "0.1.0"
edition = "2024"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
license = "MIT"
repository = "https://github.com/aovestdipaperino/tv-extensions"
description = "Extensions for turbo-vision: host-driven applications for embedders such as WASM guests, and a table grid with column separators"
keywords = ["tui", "turbo-vision", "wasm"]
categories = ["command-line-interface", "wasm"]
readme = "README.md"
exclude = ["website/*", ".superpowers/*"]

[lib]
name = "tv_extensions"
path = "src/lib.rs"

[dependencies]
# Turbo Vision without its terminal by default (`native` off), so the crate
# builds for wasm32-wasip1. Pinned to a core `main` commit that carries the
# plan-1 hooks until a release does.
turbo-vision = { git = "https://github.com/aovestdipaperino/turbo-vision-4-rust", rev = "6d299279b71cf8fdefec60c3f52da1d04e8afcbf", default-features = false }
tracing = { version = "0.1", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4.45", optional = true }
log = { version = "0.4.33", optional = true }
russh = { version = "0.48", optional = true }
russh-keys = { version = "0.48", optional = true }
async-trait = { version = "0.1", optional = true }
parking_lot = { version = "0.12", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
rand = { version = "0.8", optional = true }
ssh-key = { version = "0.6", optional = true }

[dev-dependencies]
turbo-vision = { git = "https://github.com/aovestdipaperino/turbo-vision-4-rust", rev = "6d299279b71cf8fdefec60c3f52da1d04e8afcbf", default-features = false, features = ["test-util"] }
tempfile = "3"

[features]
default = []
# A real terminal (crossterm, OS clipboard) in turbo-vision.
native = ["turbo-vision/native"]
# LogWindow and TerminalWidget, with a tracing subscriber.
log = ["dep:tracing"]
# Kitty graphics images and ANSI-art backgrounds.
graphics = ["dep:base64"]
# Ctrl+F12 PNG and F12 ANSI screen captures.
capture = ["dep:chrono", "dep:log"]
# Key chords injected over TCP, for automation.
remote-input = ["native", "dep:log"]
# Serving an application over SSH.
ssh = ["native", "dep:russh", "dep:russh-keys", "dep:async-trait", "dep:parking_lot", "dep:tokio", "dep:rand", "dep:ssh-key"]
# The CSV table editor.
csv = []

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[[example]]
name = "csv_edit"
required-features = ["csv", "native"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

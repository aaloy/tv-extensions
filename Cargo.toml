[package]
name = "tv-extensions"
version = "0.2.0"
edition = "2024"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
license = "MIT"
repository = "https://github.com/aovestdipaperino/tv-extensions"
description = "Extensions for turbo-vision: host-driven applications, ScrollPane, popup menus, a CSV editor, a logging window, Kitty/ANSI graphics, remote input, and SSH"
keywords = ["tui", "turbo-vision", "wasm"]
categories = ["command-line-interface", "wasm"]
readme = "README.md"
exclude = ["website/*", ".superpowers/*", "logo.png"]

[lib]
name = "tv_extensions"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Turbo Vision without its terminal by default (`native` off), so the crate
# builds for wasm32-wasip1. From crates.io now that 4.0 carries the
# host-driven hooks this crate depends on.
turbo-vision = { version = "4.0", default-features = false }
tracing = { version = "0.1", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4.45", optional = true }
log = { version = "0.4.33", optional = true }
russh = { version = "0.48", optional = true }
russh-keys = { version = "0.48", optional = true }
async-trait = { version = "0.1", optional = true }
parking_lot = { version = "0.12", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
rand = { version = "0.8", optional = true }
ssh-key = { version = "0.6", optional = true }
unicode-width = { version = "0.1", optional = true }

[dev-dependencies]
turbo-vision = { version = "4.0", default-features = false, features = ["test-util"] }
tempfile = "3"
# Used by the kitty_biorhythm example only; not part of the library's API.
chrono = "0.4.45"
# Used by the make_logo example only, to re-deflate the screenshot
# renderer's uncompressed PNG output; not part of the library's API.
flate2 = "1"

[features]
default = []
# A real terminal (crossterm, OS clipboard) in turbo-vision.
native = ["turbo-vision/native"]
# LogWindow and TerminalWidget, with a tracing subscriber.
log = ["dep:tracing", "dep:chrono", "dep:unicode-width"]
# Kitty graphics images and ANSI-art backgrounds.
graphics = ["dep:base64"]
# Key chords injected over TCP, for automation.
remote-input = ["native", "dep:log"]
# Serving an application over SSH.
ssh = ["native", "dep:russh", "dep:russh-keys", "dep:async-trait", "dep:parking_lot", "dep:tokio", "dep:rand", "dep:ssh-key", "dep:log"]
# The CSV table editor.
csv = []
# PNG screenshots of the terminal buffer, forwarded from turbo-vision core.
screenshot = ["turbo-vision/screenshot"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[[example]]
name = "make_logo"
required-features = ["screenshot"]

[[example]]
name = "csv_edit"
required-features = ["csv", "native"]

[[example]]
name = "kitty_image"
required-features = ["graphics", "native"]

[[example]]
name = "kitty_background"
required-features = ["graphics", "native"]

[[example]]
name = "kitty_biorhythm"
required-features = ["graphics", "native"]

[[example]]
name = "desktop_logo"
required-features = ["graphics", "native"]

[[example]]
name = "log_window"
required-features = ["log", "native"]

[[example]]
name = "terminal_widget"
required-features = ["log", "native"]

[[example]]
name = "ssh_server"
required-features = ["ssh"]

[[example]]
name = "controls"
required-features = ["native"]

[[example]]
name = "lazy_data"
required-features = ["native"]

[[example]]
name = "scroll_and_popup"
required-features = ["native"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
